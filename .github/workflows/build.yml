name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}\build-release-64
      INSTALL_DIR: ${{ github.workspace }}\install-release-64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S llvm -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_CXX_FLAGS="/utf-8" `
            -DCMAKE_C_FLAGS="/utf-8" `
            -DLLVM_ENABLE_RPMALLOC=ON `
            -DLLDB_ENABLE_PYTHON=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_ENABLE_PROJECTS="clang;lld;lldb" `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_TARGETS_TO_BUILD=X86 `
            -DLLVM_OBFUSCATION_LINK_INTO_TOOLS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_USE_CRT_RELEASE=MT

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target INSTALL -- /m
